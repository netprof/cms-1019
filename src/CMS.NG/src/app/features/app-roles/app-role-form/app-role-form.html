<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header sticky-toolbar" id="form-toolbar">
    <h1>{{ isEdit ? '編輯角色' : '新增角色' }}</h1>
    <div class="actions">
      <app-row-audit-badge tableName="AppRole" [pkid]="pkid()" />
      <p-button id="cancel-button" label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
      <p-button id="save-button" type="submit" label="儲存" icon="pi pi-check" [loading]="saving()" />
    </div>
  </div>

  <div class="card">
    <h2>角色資料</h2>

    <div class="field">
      <label for="roleId">角色代碼<span class="req">*</span></label>
      <input pInputText id="roleId" formControlName="roleId" placeholder="請輸入角色代碼" />
      @if (invalid('roleId')) { <small class="error">請輸入角色代碼</small> }
    </div>

    <div class="field">
      <label for="roleName">角色名稱<span class="req">*</span></label>
      <input pInputText id="roleName" formControlName="roleName" />
      @if (invalid('roleName')) { <small class="error">請輸入角色名稱</small> }
    </div>

    <div class="field">
      <label for="permissionLevel">權限等級<span class="req">*</span></label>
      <p-inputnumber inputId="permissionLevel" formControlName="permissionLevel" [useGrouping]="false" [style]="{ width: '100%' }" />
      @if (invalid('permissionLevel')) { <small class="error">請輸入權限等級</small> }
    </div>

    <div class="field">
      <label for="description">描述<span class="req">*</span></label>
      <input pInputText id="description" formControlName="description" />
      @if (invalid('description')) { <small class="error">請輸入描述</small> }
    </div>
  </div>

  <div class="card">
    <h2>使用者</h2>
    <p-multiselect
      formControlName="userIds"
      [options]="userOptions"
      optionLabel="label"
      optionValue="userId"
      placeholder="選擇使用者（可複選）"
      display="chip"
      [maxSelectedLabels]="9999"
      [filter]="userOptions.length >= 10"
      appendTo="body"
      [style]="{ width: '100%' }"
    />
  </div>
</form>
