<p-toast />
<p-confirmdialog />

<div class="page-header">
  <h1>角色 AppRole <small>使用者角色</small></h1>
  <div class="actions">
    <p-button
      id="filter-button"
      label="搜尋條件"
      icon="pi pi-filter"
      [severity]="hasFilters ? 'primary' : 'secondary'"
      [outlined]="hasFilters"
      (onClick)="drawerVisible.set(true)"
    />
    <p-button id="add-button" label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="card">
  <p-table
    [value]="roles()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [tableStyle]="{ 'min-width': '60rem' }"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" style="width: 8rem">權限等級 <p-sortIcon field="permissionLevel" /></th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" style="width: 8rem">使用者數 <p-sortIcon field="userCount" /></th>
        <th style="width: 9rem; text-align: center">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td style="text-align: center">{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td style="text-align: center">{{ role.userCount }}</td>
        <td style="text-align: center">
          <p-button icon="pi pi-eye" [text]="true" severity="secondary" ariaLabel="檢視" (onClick)="view(role)" />
          <p-button icon="pi pi-pencil" [text]="true" ariaLabel="編輯" (onClick)="edit(role)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" ariaLabel="刪除" (onClick)="remove(role)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" style="text-align: center">沒有符合的資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer header="搜尋條件" position="right" [visible]="drawerVisible()" (visibleChange)="drawerVisible.set($event)">
  <div class="field">
    <label for="f-keyword">關鍵字</label>
    <input pInputText id="f-keyword" [(ngModel)]="filters.keyword" placeholder="角色代碼、名稱或描述" (keyup.enter)="applyFilters()" />
  </div>
  <div class="field">
    <label for="f-min">權限等級（最小）</label>
    <p-inputnumber inputId="f-min" [(ngModel)]="filters.minPermissionLevel" [useGrouping]="false" />
  </div>
  <div class="field">
    <label for="f-max">權限等級（最大）</label>
    <p-inputnumber inputId="f-max" [(ngModel)]="filters.maxPermissionLevel" [useGrouping]="false" />
  </div>
  <div class="actions" style="display: flex; gap: 0.5rem">
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
    <p-button label="清除" icon="pi pi-times" severity="secondary" (onClick)="clearFilters()" />
  </div>
</p-drawer>
