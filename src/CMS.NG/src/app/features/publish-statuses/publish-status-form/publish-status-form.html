<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header sticky-toolbar" id="form-toolbar">
    <h1>{{ isEdit ? '編輯發布狀態' : '新增發布狀態' }}</h1>
    <div class="actions">
      <p-button id="cancel-button" label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
      <p-button id="save-button" type="submit" label="儲存" icon="pi pi-check" [loading]="saving()" />
    </div>
  </div>

  <div class="card">
    <h2>發布狀態資料</h2>

    <div class="field">
      <label for="pkid">主代碼<span class="req">*</span></label>
      <p-inputnumber
        inputId="pkid"
        formControlName="pkid"
        [min]="0"
        [max]="255"
        [useGrouping]="false"
        placeholder="0–255"
        [style]="{ width: '100%' }"
      />
      @if (invalid('pkid')) { <small class="error">請輸入 0–255 的主代碼</small> }
    </div>

    <div class="field">
      <label for="description">狀態說明<span class="req">*</span></label>
      <input pInputText id="description" formControlName="description" maxlength="50" />
      @if (invalid('description')) { <small class="error">請輸入狀態說明（最多 50 字）</small> }
    </div>

    <div class="field">
      <label>旗標</label>
      <div class="checks">
        <div class="check">
          <p-checkbox inputId="isDraft" formControlName="isDraft" [binary]="true" />
          <label for="isDraft">草稿</label>
        </div>
        <div class="check">
          <p-checkbox inputId="isPublished" formControlName="isPublished" [binary]="true" />
          <label for="isPublished">已發布</label>
        </div>
        <div class="check">
          <p-checkbox inputId="isDiscontinued" formControlName="isDiscontinued" [binary]="true" />
          <label for="isDiscontinued">已停用</label>
        </div>
      </div>
    </div>
  </div>
</form>
