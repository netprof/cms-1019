<p-toast />
<p-confirmdialog />

<div class="page-header">
  <h1>發布狀態 PublishStatus <small>內容發布狀態代碼</small></h1>
  <div class="actions">
    <p-button
      id="filter-button"
      label="搜尋條件"
      icon="pi pi-filter"
      [severity]="hasFilters ? 'primary' : 'secondary'"
      [outlined]="hasFilters"
      (onClick)="drawerVisible.set(true)"
    />
    <p-button id="add-button" label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="card">
  <p-table
    [value]="statuses()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 7rem; text-align: center">草稿 <p-sortIcon field="isDraft" /></th>
        <th pSortableColumn="isPublished" style="width: 7rem; text-align: center">已發布 <p-sortIcon field="isPublished" /></th>
        <th pSortableColumn="isDiscontinued" style="width: 7rem; text-align: center">已停用 <p-sortIcon field="isDiscontinued" /></th>
        <th style="width: 9rem; text-align: center">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-s>
      <tr>
        <td>{{ s.pkid }}</td>
        <td>{{ s.description }}</td>
        <td style="text-align: center">
          <p-tag [value]="s.isDraft ? '是' : '否'" [severity]="s.isDraft ? 'success' : 'secondary'" />
        </td>
        <td style="text-align: center">
          <p-tag [value]="s.isPublished ? '是' : '否'" [severity]="s.isPublished ? 'success' : 'secondary'" />
        </td>
        <td style="text-align: center">
          <p-tag [value]="s.isDiscontinued ? '是' : '否'" [severity]="s.isDiscontinued ? 'success' : 'secondary'" />
        </td>
        <td style="text-align: center">
          <p-button icon="pi pi-eye" [text]="true" severity="secondary" ariaLabel="檢視" (onClick)="view(s)" />
          <p-button icon="pi pi-pencil" [text]="true" ariaLabel="編輯" (onClick)="edit(s)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" ariaLabel="刪除" (onClick)="remove(s)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" style="text-align: center">沒有符合的資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer header="搜尋條件" position="right" [visible]="drawerVisible()" (visibleChange)="drawerVisible.set($event)">
  <div class="field">
    <label for="f-keyword">關鍵字</label>
    <input pInputText id="f-keyword" [(ngModel)]="filters.keyword" placeholder="狀態說明" (keyup.enter)="applyFilters()" />
  </div>
  <div class="field">
    <label for="f-isDraft">草稿</label>
    <p-select
      inputId="f-isDraft"
      [(ngModel)]="filters.isDraft"
      [options]="boolOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="全部"
      [showClear]="true"
      appendTo="body"
      [style]="{ width: '100%' }"
    />
  </div>
  <div class="field">
    <label for="f-isPublished">已發布</label>
    <p-select
      inputId="f-isPublished"
      [(ngModel)]="filters.isPublished"
      [options]="boolOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="全部"
      [showClear]="true"
      appendTo="body"
      [style]="{ width: '100%' }"
    />
  </div>
  <div class="field">
    <label for="f-isDiscontinued">已停用</label>
    <p-select
      inputId="f-isDiscontinued"
      [(ngModel)]="filters.isDiscontinued"
      [options]="boolOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="全部"
      [showClear]="true"
      appendTo="body"
      [style]="{ width: '100%' }"
    />
  </div>
  <div class="actions" style="display: flex; gap: 0.5rem">
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
    <p-button label="清除" icon="pi pi-times" severity="secondary" (onClick)="clearFilters()" />
  </div>
</p-drawer>
