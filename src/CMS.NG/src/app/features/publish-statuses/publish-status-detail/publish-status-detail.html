<p-toast />

<div class="page-header">
  <h1>檢視發布狀態</h1>
  <div class="actions">
    <p-button id="back-button" label="返回" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
    @if (status()) {
      <p-button id="edit-button" label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
    }
  </div>
</div>

@if (status(); as s) {
  <div class="card">
    <h2>發布狀態資料</h2>
    <dl>
      <dt>主代碼</dt><dd>{{ s.pkid }}</dd>
      <dt>狀態說明</dt><dd>{{ s.description }}</dd>
      <dt>草稿</dt>
      <dd><p-tag [value]="s.isDraft ? '是' : '否'" [severity]="s.isDraft ? 'success' : 'secondary'" /></dd>
      <dt>已發布</dt>
      <dd><p-tag [value]="s.isPublished ? '是' : '否'" [severity]="s.isPublished ? 'success' : 'secondary'" /></dd>
      <dt>已停用</dt>
      <dd><p-tag [value]="s.isDiscontinued ? '是' : '否'" [severity]="s.isDiscontinued ? 'success' : 'secondary'" /></dd>
    </dl>
  </div>
}
