<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header sticky-toolbar" id="form-toolbar">
    <h1>{{ isEdit ? '編輯使用者' : '新增使用者' }}</h1>
    <div class="actions">
      <app-row-audit-badge tableName="AppUser" [pkid]="pkid()" />
      @if (isEdit) {
        <!-- Admin only; renders nothing for other users. -->
        <app-reset-password-button [userId]="userId!" />
      }
      <p-button id="cancel-button" label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
      <p-button id="save-button" type="submit" label="儲存" icon="pi pi-check" [loading]="saving()" />
    </div>
  </div>

  <div class="card">
    <h2>使用者資料</h2>

    @if (!isEdit) {
      <p-message id="default-password-hint" severity="info" [style]="{ 'margin-bottom': '1rem' }">
        新增後密碼為系統預設密碼，可於檢視頁重設。
      </p-message>
    }

    @if (isEdit) {
      <div class="field">
        <label for="pkid">主代碼</label>
        <input pInputText id="pkid" [value]="pkid() ?? ''" disabled />
      </div>
    }

    <div class="field">
      <label for="userId">帳號<span class="req">*</span></label>
      <input pInputText id="userId" formControlName="userId" maxlength="200" placeholder="請輸入帳號" />
      @if (invalid('userId')) { <small class="error">請輸入帳號（最多 200 字）</small> }
    </div>

    <div class="field">
      <label for="userName">使用者名稱<span class="req">*</span></label>
      <input pInputText id="userName" formControlName="userName" maxlength="200" />
      @if (invalid('userName')) { <small class="error">請輸入使用者名稱（最多 200 字）</small> }
    </div>

    <div class="field">
      <label for="isActive">啟用</label>
      <div class="toggle">
        <p-toggleswitch inputId="isActive" formControlName="isActive" />
        <span>{{ form.controls.isActive.value ? '啟用' : '停用' }}</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>角色</h2>
    <p-multiselect
      formControlName="roleIds"
      [options]="roleOptions"
      optionLabel="label"
      optionValue="roleId"
      placeholder="選擇角色（可複選）"
      display="chip"
      [maxSelectedLabels]="9999"
      [filter]="roleOptions.length >= 10"
      appendTo="body"
      [style]="{ width: '100%' }"
    />
  </div>
</form>
