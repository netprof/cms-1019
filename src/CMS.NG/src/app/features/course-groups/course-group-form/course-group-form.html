<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header sticky-toolbar" id="form-toolbar">
    <h1>{{ isEdit ? '編輯課程群組' : '新增課程群組' }}</h1>
    <div class="actions">
      <p-button id="cancel-button" label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
      <p-button id="save-button" type="submit" label="儲存" icon="pi pi-check" [loading]="saving()" />
    </div>
  </div>

  <div class="card">
    <h2>課程群組資料</h2>

    @if (isEdit) {
      <div class="field">
        <label for="pkid">主代碼</label>
        <input pInputText id="pkid" [value]="pkid" disabled />
      </div>
    }

    <div class="field">
      <label for="description">群組說明<span class="req">*</span></label>
      <input pInputText id="description" formControlName="description" maxlength="100" />
      @if (invalid('description')) { <small class="error">請輸入群組說明（最多 100 字）</small> }
    </div>
  </div>
</form>
