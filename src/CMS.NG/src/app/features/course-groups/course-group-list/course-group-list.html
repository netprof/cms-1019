<p-toast />
<p-confirmdialog />

<div class="page-header">
  <h1>課程群組 CourseGroup <small>課程分類群組</small></h1>
  <div class="actions">
    <p-button
      id="filter-button"
      label="搜尋條件"
      icon="pi pi-filter"
      [severity]="hasFilters ? 'primary' : 'secondary'"
      [outlined]="hasFilters"
      (onClick)="drawerVisible.set(true)"
    />
    <p-button id="add-button" label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="card">
  <p-table
    [value]="groups()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [tableStyle]="{ 'min-width': '40rem' }"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">群組說明 <p-sortIcon field="description" /></th>
        <th style="width: 12rem; text-align: center">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-g>
      <tr>
        <td>{{ g.pkid }}</td>
        <td>{{ g.description }}</td>
        <td style="text-align: center">
          <p-button icon="pi pi-book" [text]="true" severity="info" ariaLabel="查看課程" (onClick)="viewCourses(g)" />
          <p-button icon="pi pi-eye" [text]="true" severity="secondary" ariaLabel="檢視" (onClick)="view(g)" />
          <p-button icon="pi pi-pencil" [text]="true" ariaLabel="編輯" (onClick)="edit(g)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" ariaLabel="刪除" (onClick)="remove(g)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3" style="text-align: center">沒有符合的資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer header="搜尋條件" position="right" [visible]="drawerVisible()" (visibleChange)="drawerVisible.set($event)">
  <div class="field">
    <label for="f-keyword">關鍵字</label>
    <input
      pInputText
      id="f-keyword"
      [(ngModel)]="filters.keyword"
      placeholder="群組說明"
      (keyup.enter)="applyFilters()"
    />
  </div>
  <div class="actions" style="display: flex; gap: 0.5rem">
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
    <p-button label="清除" icon="pi pi-times" severity="secondary" (onClick)="clearFilters()" />
  </div>
</p-drawer>
