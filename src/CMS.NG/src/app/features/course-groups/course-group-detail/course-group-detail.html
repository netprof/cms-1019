<p-toast />

<div class="page-header">
  <h1>檢視課程群組</h1>
  <div class="actions">
    <app-row-audit-badge tableName="CourseGroup" [pkid]="group()?.pkid ?? null" />
    <p-button id="back-button" label="返回" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
    @if (group()) {
      <p-button id="courses-button" label="查看課程" icon="pi pi-book" severity="info" [outlined]="true" (onClick)="viewCourses()" />
      <p-button id="edit-button" label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
    }
  </div>
</div>

@if (group(); as g) {
  <div class="card">
    <h2>課程群組資料</h2>
    <dl>
      <dt>主代碼</dt><dd>{{ g.pkid }}</dd>
      <dt>群組說明</dt><dd id="description">{{ g.description }}</dd>
    </dl>
  </div>
}
