<!-- 5xx toasts from authInterceptor; keyed, so the pages' own <p-toast /> don't repeat them. -->
<p-toast [key]="serverErrorToastKey" />
@if (auth.profile(); as profile) {
<div class="layout" [class.collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-text">CMS</span>
      <button type="button" class="collapse-btn" aria-label="Toggle sidebar" (click)="collapsed.set(!collapsed())">
        <i class="pi" [class.pi-angle-left]="!collapsed()" [class.pi-angle-right]="collapsed()"></i>
      </button>
    </div>

    <nav>
      @for (group of visibleNavGroups(); track group.label) {
        <button type="button" class="nav-group" (click)="toggleGroup(group.label)">
          <i class="pi {{ group.icon }}"></i>
          <span class="label">{{ group.label }}</span>
          <i class="pi chevron" [class.pi-chevron-down]="openGroups().has(group.label)" [class.pi-chevron-right]="!openGroups().has(group.label)"></i>
        </button>
        @if (openGroups().has(group.label)) {
          @for (item of group.items; track item.route) {
            <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
              <i class="pi {{ item.icon }}"></i>
              <span class="label">{{ item.label }}</span>
            </a>
          }
        }
      }
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <a id="my-profile-link" class="user-link" routerLink="/profile" routerLinkActive="active" title="我的資料 My Profile">
        <i class="pi pi-user"></i> <span id="signed-in-user">{{ profile.userName }}</span>
      </a>
      <button type="button" id="logout-button" class="logout-btn" (click)="auth.logout()"><i class="pi pi-sign-out"></i> 登出</button>
    </header>
    <router-outlet />
  </main>
</div>
} @else {
  <!-- Signed out: only the login page renders, without the shell. -->
  <router-outlet />
}
